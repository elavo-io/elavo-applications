# The shared Applications folder. /Applications in the image is a symlink to
# it. Administrators (wheel) can add and remove entries; the setgid bit and
# the default ACL keep what they add writable for the other administrators.
d /var/Applications 2775 root wheel -
a+ /var/Applications - - - - default:group:wheel:rwx,default:other::r-x
# /var and the home directories are separate mounts, so moving an entry from
# /var/Applications to the Trash needs a Trash at the top of /var.
d /var/.Trash 1777 root root -
# Desktop files for the shared entries. environment.d and profile.d add
# /var/lib/elavo-applications/exports/share to XDG_DATA_DIRS.
d /var/lib/elavo-applications 0755 root root -
d /var/lib/elavo-applications/exports/share/applications 0755 root root -
