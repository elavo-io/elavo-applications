[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/elavo-applications",
    "crates/elavo-applications-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elavo-io/elavo-applications"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gio = "0.22"
gio-unix = "0.22"
gdk-pixbuf = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
elavo-applications-core = { path = "crates/core" }

[profile.release]
lto = "thin"
strip = true
